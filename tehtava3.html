          <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <!-- Linkit -->

      <!-- NAVIGAATIO loppuu -->
    </header>
    <main>
      <div id="vastaus"></div>

      <script>
        fetch(
          "https://api.openweathermap.org/data/2.5/weather?id=658225&appid=665ecd56dfc08dbb50feb8b8f5034e28&lang=fi&units=metric",
        )
          .then(function (response) {
            return response.json();
          })

          .then(function (responseJson) {
            kerro(responseJson);
          })

          .catch(function (error) {
            document.getElementById("vastaus").innerHTML =
              "<p>Tietoa ei pystytä hakemaan</p>";
          });

        function kerro(obj) {
          let aika = new Date().toLocaleTimeString("fi-FI", {
            hour: "2-digit",
            minute: "2-digit",
          });

          let ikoni =
            "https://openweathermap.org/img/wn/" +
            obj.weather[0].icon +
            "@2x.png";

          let tiedot =
            "<div class='card p-3 shadow' style='width: 300px;'>" +
            "<h2>Sää Helsingissä</h2>" +
            "<p>Sää kello " +
            aika +
            "</p>" +
            "<h3>Sää:</h3>" +
            "<p>" +
            obj.weather[0].description +
            "</p>" +
            "<h3>Lämpötila:</h3>" +
            "<p>" +
            obj.main.temp +
            "°C</p>" +
            "<h3>Tuuli:</h3>" +
            "<p>" +
            obj.wind.speed +
            " m/s</p>" +
            "<img class='saaikoni' src='" +
            ikoni +
            "'>";
          ("</div>");

          document.getElementById("vastaus").innerHTML = tiedot;
        }
      </script>
    </main>
  </body>
</html>
